# The production stack (P-5.8). Ten services, the console, the backing infrastructure and one edge.
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# ⚠️ **Nothing is published except the edge.** Mongo, Redis, MinIO, NATS and all ten services bind
# only to the compose network; the only ports on the host are 80 and 443 on the proxy. This is the
# property that separates a deployment from a development stack, and it is verifiable rather than
# asserted: `docker compose ps` shows one row with a host port. A database reachable from the host is
# a database reachable from anything that can route to the host.
#
# ⚠️ `restart: unless-stopped` everywhere, so the recovery verification in this milestone measures
# what an operator would actually experience — a service that is killed comes back, and the question
# is only whether the UI recovers with it.
#
# See docs/guides/DEPLOYMENT.md.
name: vip-prod

# ── shared fragments ─────────────────────────────────────────────────────────────────────────────
x-service-build: &service-build
  context: ../..
  dockerfile: infra/docker/Dockerfile.service

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Container-internal DSNs. These names resolve on the compose network and nowhere else.
  MONGO_URI: mongodb://${MONGO_USER:?set MONGO_USER}:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongodb:27017/vip?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  NATS_URL: nats://nats:4222
  # ⚠️ No defaults for any secret. `:?` makes compose refuse to start rather than silently deploy
  # with a development key — the failure mode that produces a "production" system signing tokens
  # with `change_me_dev_only`.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
  S3_ENDPOINT: http://minio:9000
  # ⚠️ The name a **browser** uses. `S3_ENDPOINT` above resolves only on this network, so signed
  # playback URLs built from it are unusable by any operator — measured in P-5.8, where playback
  # returned `http://minio:9000/...` and no browser could resolve it. The edge proxies
  # `/vip-recordings/*` to MinIO under this hostname, and SigV4 covers `Host`, so the signature is
  # verified against exactly the name that was used.
  S3_PUBLIC_ENDPOINT: ${VIP_PUBLIC_URL:?set VIP_PUBLIC_URL}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-vip-recordings}
  S3_FORCE_PATH_STYLE: 'true'

x-service-common: &service-common
  restart: unless-stopped
  # ⚠️ 20s to drain. The default is 10, and a service still writing an audit record when the runtime
  # SIGKILLs it is exactly the kind of loss that immutable history cannot repair.
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

x-infra-deps: &infra-deps
  mongodb: { condition: service_healthy }
  nats: { condition: service_healthy }

services:
  # ══ infrastructure ═════════════════════════════════════════════════════════════════════════════
  mongodb:
    image: mongo:8
    restart: unless-stopped
    command: ['--quiet']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?set REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ['-js', '-m', '8222', '-sd', '/data']
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_RECORDINGS_BUCKET: ${S3_RECORDINGS_BUCKET:-vip-recordings}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_RECORDINGS_BUCKET" &&
        echo "bucket ready: $$S3_RECORDINGS_BUCKET"
    restart: 'no'

  # ══ services ═══════════════════════════════════════════════════════════════════════════════════
  # ⚠️ Every service waits for Mongo and NATS to be *healthy*, not merely started. Fail-fast config
  # validation means a service that boots before its dependencies dies and restarts in a loop, which
  # looks identical to a broken build in the logs.
  identity:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: identity } }
    image: vip/identity:local
    environment: { <<: *service-env, PORT: '8089', SERVICE_NAME: identity }
    depends_on: *infra-deps

  tenant:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: tenant } }
    image: vip/tenant:local
    environment: { <<: *service-env, PORT: '8081', SERVICE_NAME: tenant }
    depends_on: *infra-deps

  camera:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: camera } }
    image: vip/camera:local
    environment:
      <<: *service-env
      PORT: '8082'
      SERVICE_NAME: camera
      # ══ Camera Processing Assignment — the control plane (P-8 Phase 6) ═══════════════════════
      # ⚠️ The runtime this deployment ships with, seeded ONCE if the registry is empty. Without it
      # a fresh install comes up with an inference container running, a control plane that has never
      # heard of it, and every camera unplaceable — which looks exactly like a broken deployment and
      # is fixed by an API call nobody knows to make. `$setOnInsert`, so operator edits survive.
      ASSIGNMENT_RUNTIME_URL: ${ASSIGNMENT_RUNTIME_URL:-http://inference:8085}
      ASSIGNMENT_RUNTIME_ID: ${ASSIGNMENT_RUNTIME_ID:-inference}
      ASSIGNMENT_RUNTIME_NAME: ${ASSIGNMENT_RUNTIME_NAME:-Inference runtime}
      # ⚠️ The PROVISIONAL ceiling from the P-8 Phase 5 benchmark, not a guess. Two cameras is the
      # supported figure; four is provisional. A capacity nobody measured makes every capacity
      # refusal unexplainable — see AI_RUNTIME_BENCHMARK.md.
      ASSIGNMENT_RUNTIME_MAX_CAMERAS: ${ASSIGNMENT_RUNTIME_MAX_CAMERAS:-4}
      # ⚠️ Read ONLY for the capability matrix's `rules` fact, with the CALLER's token forwarded.
      # Unset is valid: the fact reads `unknown` rather than `false`.
      RULES_URL: ${RULES_SERVICE_URL:-http://rules:8086}
    depends_on: *infra-deps

  media:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: media } }
    image: vip/media:local
    environment:
      <<: *service-env
      PORT: '8083'
      SERVICE_NAME: media
      CAMERA_URL: http://camera:8082
      # ⚠️ The perception seam, connected (P-8 Phase 2, ADR-A). Blank would keep the null sink and the
      # pre-Phase-2 behaviour; this is the one variable that turns frame delivery on. Delivery is
      # non-blocking and bounded per camera, so a slow or absent runtime costs frames and never
      # segments — the hard requirement of this phase.
      INFERENCE_URL: ${INFERENCE_URL:-http://inference:8085}
      MEDIA_FRAME_QUEUE_PER_CAMERA: ${MEDIA_FRAME_QUEUE_PER_CAMERA:-2}
      MEDIA_FRAME_MAX_INFLIGHT: ${MEDIA_FRAME_MAX_INFLIGHT:-4}
      # ⚠️ The Event Bridge (P-8 Phase 5) — the one variable that turns publishing on. Off keeps the
      # pre-Phase-5 behaviour exactly: frames are analysed and nothing is published. Publishing is
      # non-blocking, bounded per camera and drops under pressure, so a slow or absent broker costs
      # events and never segments — the same hard requirement as the perception seam above.
      MEDIA_EVENT_BRIDGE_ENABLED: ${MEDIA_EVENT_BRIDGE_ENABLED:-1}
      MEDIA_EVENT_QUEUE_PER_CAMERA: ${MEDIA_EVENT_QUEUE_PER_CAMERA:-16}
      MEDIA_EVENT_MAX_INFLIGHT: ${MEDIA_EVENT_MAX_INFLIGHT:-4}
      MEDIA_EVENT_MAX_ATTEMPTS: ${MEDIA_EVENT_MAX_ATTEMPTS:-2}
      # ⚠️ Camera Processing Assignment (P-8 Phase 6) — the one variable that makes the plan govern
      # which cameras are analysed. OFF keeps the pre-Phase-6 behaviour exactly: every camera is
      # analysed. It is ON here because a control plane the deployment does not obey is a control
      # plane nothing verifies; the choice is logged at boot either way.
      MEDIA_ASSIGNMENT_ENABLED: ${MEDIA_ASSIGNMENT_ENABLED:-1}
      MEDIA_ASSIGNMENT_INTERVAL_MS: ${MEDIA_ASSIGNMENT_INTERVAL_MS:-5000}
    depends_on:
      <<: *infra-deps
      minio: { condition: service_healthy }

  events:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: events } }
    image: vip/events:local
    environment: { <<: *service-env, PORT: '8084', SERVICE_NAME: events }
    depends_on: *infra-deps

  rules:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: rules } }
    image: vip/rules:local
    environment:
      <<: *service-env
      PORT: '8086'
      SERVICE_NAME: rules
      # ⚠️ P-8 Phase 7. The camera context, for two things with opposite failure postures:
      #
      #   1. **Scope resolution at validation time** — fails CLOSED. Unreachable means a camera-,
      #      group- or zone-scoped rule reports `verified: false` and cannot be enabled, which is
      #      correct: a rule that goes live because a check could not run is the configuration
      #      version of certifying hardware from a simulation.
      #   2. **The zone name/version cache** — fails SOFT. A candidate whose zone could not be named
      #      carries the zone id, which is honest and still actionable. Blocking an alert on a name
      #      lookup would be the wrong trade in every direction.
      #
      # ⚠️ Blank keeps the pre-Phase-7 behaviour exactly — and that behaviour was itself a latent
      # defect: nothing had ever wired a camera directory, so EVERY camera-scoped rule in every
      # deployment was unverifiable and therefore un-enablable. Recorded as L-56.
      CAMERA_SERVICE_URL: ${CAMERA_SERVICE_URL:-http://camera:8082}
      RULES_ZONE_CATALOG_INTERVAL_MS: ${RULES_ZONE_CATALOG_INTERVAL_MS:-15000}
    depends_on: *infra-deps

  workflow:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: workflow } }
    image: vip/workflow:local
    environment:
      <<: *service-env
      PORT: '8087'
      SERVICE_NAME: workflow
      # ⚠️ The Investigation Workspace reports its sources honestly: unset, these panels say
      # "not configured for this deployment" even while the services behind them are running.
      EVENTS_SERVICE_URL: http://events:8084
      EVIDENCE_SERVICE_URL: http://evidence:8090
      NOTIFY_SERVICE_URL: http://notify:8088
    depends_on: *infra-deps

  notify:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: notify } }
    image: vip/notify:local
    environment: { <<: *service-env, PORT: '8088', SERVICE_NAME: notify }
    depends_on: *infra-deps

  evidence:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: evidence } }
    image: vip/evidence:local
    environment:
      <<: *service-env
      PORT: '8090'
      SERVICE_NAME: evidence
      EVIDENCE_STORAGE_PROVIDER: s3
      EVIDENCE_DOWNLOAD_TTL_SECONDS: ${EVIDENCE_DOWNLOAD_TTL_SECONDS:-900}
    depends_on:
      <<: *infra-deps
      minio: { condition: service_healthy }
      createbuckets: { condition: service_completed_successfully }

  # ══ perception ═════════════════════════════════════════════════════════════════════════════════
  # The AI inference runtime (P-8 Phase 1). ⚠️ Deployed **beside** the platform and wired to nothing:
  # no camera reaches it, no frame is sent to it, and no route on the gateway points at it. That is
  # the whole of Phase 1 — a runtime that has never run in production now runs in production, and
  # every later phase connects to something that is known to start rather than to something hoped for.
  #
  # ⚠️ **It depends on no infrastructure at all**, and that is a property worth keeping: the `stub`
  # backend needs no model registry, the `null` event sink needs no NATS, and nothing here persists.
  # The runtime comes up when Mongo is down, which is what a perception tier should do.
  inference:
    <<: *service-common
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.inference
      # ⚠️ **onnx, not stub** (P-8 Phase 3). The stub backend returns a fabricated detection for any
      # bytes at all — useful for exercising the pipeline, and indistinguishable from a working
      # product to anyone reading a dashboard. The deployed runtime now runs real models.
      # ⚠️ Block style, not `{ ... }`. A `${VAR:-default}` inside a YAML flow mapping is a parse
      # error — the `}` closes the mapping early — and compose reports it as a syntax error 200
      # lines from anything you edited.
      args:
        INFERENCE_BACKEND: ${INFERENCE_BACKEND:-onnx}
    image: vip/inference:local
    # ⚠️ PID 1 reaping. `Dockerfile.service` uses tini; this image installs no apt packages, so the
    # equivalent comes from compose. The process installs its own SIGTERM handler either way.
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: '8085'
      SERVICE_NAME: inference
      # The shared internal key, as every other service. No new secret is introduced by this phase.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      # ⚠️ Both of these are QUOTED because YAML reads a bare `null` as the null value, which compose
      # then treats as "inherit from the host environment" — a silent misconfiguration that would
      # look identical to a correct one until something tried to publish.
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-onnx}
      INFERENCE_EVENT_SINK: 'null'
      NATS_URL: nats://nats:4222
      INFERENCE_MAX_SESSIONS: ${INFERENCE_MAX_SESSIONS:-8}
      INFERENCE_DEPLOYMENT_PROFILE: ${INFERENCE_DEPLOYMENT_PROFILE:-}
      # ⚠️ `local`: models come from the checksummed catalogue inside the image, not from MLflow. A
      # production container whose model set is decided by a dev-stack tracking server it must reach
      # at boot has that server on its critical path, and the model it runs stops being a property
      # of the image. MLflow remains the authoring path (INFERENCE_MODEL_SOURCE=mlflow).
      INFERENCE_MODEL_SOURCE: 'local'
      # Empty = run the catalogue's default. An unknown id is REFUSED at start, never ignored.
      INFERENCE_ACTIVE_MODEL: ${INFERENCE_ACTIVE_MODEL:-}
      # 0 = derive the intra-op pool from the cgroup CPU quota (TD-61), not the host's core count.
      INFERENCE_ONNX_INTRA_THREADS: ${INFERENCE_ONNX_INTRA_THREADS:-0}
      # ⚠️ Warm-up stays ON in production. It is exposed here only so the hardening verification can
      # turn it off and MEASURE what it buys — a claim nobody had numbers for until P-8 Phase 3H.
      INFERENCE_ONNX_WARMUP: ${INFERENCE_ONNX_WARMUP:-1}

  gateway:
    <<: *service-common
    build: { <<: *service-build, args: { SERVICE: gateway } }
    image: vip/gateway:local
    environment:
      <<: *service-env
      PORT: '8080'
      SERVICE_NAME: gateway
      IDENTITY_URL: http://identity:8089
      TENANT_URL: http://tenant:8081
      CAMERA_URL: http://camera:8082
      MEDIA_URL: http://media:8083
      EVENTS_URL: http://events:8084
      RULES_URL: http://rules:8086
      WORKFLOW_URL: http://workflow:8087
      NOTIFY_URL: http://notify:8088
      EVIDENCE_URL: http://evidence:8090
      STREAM_ENABLED: 'true'
      # ⚠️ Empty on purpose. The console is served from the same origin as the API, so no
      # cross-origin request is ever made and no origin needs allowing. An entry here would widen
      # the surface for nothing.
      CORS_ALLOWED_ORIGINS: ''
    depends_on: *infra-deps

  # ══ edge ═══════════════════════════════════════════════════════════════════════════════════════
  console:
    <<: *service-common
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.console
    image: vip/console:local

  proxy:
    <<: *service-common
    image: caddy:2-alpine
    ports:
      - '${VIP_HTTP_PORT:-80}:80'
      - '${VIP_HTTPS_PORT:-443}:443'
    environment:
      VIP_PUBLIC_URL: ${VIP_PUBLIC_URL:-https://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The internal CA's root key lives here; losing it means every client re-trusts a new CA.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - console
      - minio

  # ══ bootstrap (profile: seed) ══════════════════════════════════════════════════════════════════
  # ⚠️ Seeding runs *inside* the network, not from the host — the host cannot reach Mongo, which is
  # the point. `--profile seed` keeps it out of the normal `up`.
  #   docker compose ... --profile seed run --rm seed
  #   docker compose ... --profile seed run --rm seed pnpm --filter @vip/seed evidence
  seed:
    profiles: ['seed']
    build: { <<: *service-build, args: { SERVICE: identity } }
    image: vip/identity:local
    # ⚠️ `tsx` from the workspace, not `pnpm --filter`. The runtime stage has no package manager on
    # PATH — corepack is enabled only in the build stage — and reaching for one here would mean
    # either shipping corepack into production images or having the first `pnpm` invocation download
    # itself, which fails on an air-gapped host. The binary that is already in the image is enough.
    working_dir: /app/tools/seed
    entrypoint: ['/sbin/tini', '--']
    command: ['node_modules/.bin/tsx', 'seed.ts']
    environment:
      <<: *service-env
      VIP_PUBLIC_URL: ${VIP_PUBLIC_URL:-https://localhost}
      SEED_IDENTITY_URL: http://identity:8089
      SEED_EVIDENCE_URL: http://evidence:8090
      SEED_TENANT_ID: ${SEED_TENANT_ID:-tnt_dev}
      SEED_EMAIL: ${SEED_EMAIL:-owner@vip.dev}
      # ⚠️ Required, with no fallback. Under `NODE_ENV=production` the seed refuses the development
      # password outright, so an unset value stops the bootstrap here rather than creating an owner
      # account whose password is published in this repository.
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    depends_on:
      mongodb: { condition: service_healthy }
    restart: 'no'

  # ⚠️ The demo dataset — four fictional tenants across four verticals. Separate from `seed` because
  # they answer different questions: `seed` is the minimum a deployment needs to be usable, this is
  # what a customer demonstration needs to look like a working estate. Never run against a tenant
  # that holds real data; it only ever writes `tnt_demo_*`.
  #   infra/docker/demo.sh reset
  seed-demo:
    profiles: ['seed']
    image: vip/identity:local
    working_dir: /app/tools/seed
    entrypoint: ['/sbin/tini', '--']
    command: ['node_modules/.bin/tsx', 'demo.ts']
    environment:
      <<: *service-env
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    depends_on:
      mongodb: { condition: service_healthy }
    restart: 'no'

  # ⚠️ Demo evidence — NOT part of a customer bootstrap. A real deployment gets its evidence from
  # the media service ingesting recordings; this exists so a demonstration has something to play.
  # It registers through the **real evidence API**, so custody opens and the integrity hash is
  # computed from the stored bytes — a row written straight into Mongo would show the Evidence Chain
  # panel a custody log the platform never produced.
  #
  #   SEED_EVIDENCE_DIR=$(pwd)/.data/demo-clips infra/docker/prod.sh --profile seed run --rm seed-evidence
  seed-evidence:
    profiles: ['seed']
    # ⚠️ The **evidence** image, not identity. Each image is built with `--filter "<svc>..."`, so it
    # contains only that service's dependency closure — and `@vip/storage` is in evidence's, not
    # identity's. Running this from the identity image fails at import with ERR_MODULE_NOT_FOUND.
    image: vip/evidence:local
    working_dir: /app/tools/seed
    entrypoint: ['/sbin/tini', '--']
    command: ['node_modules/.bin/tsx', 'evidence.ts']
    volumes:
      - ${SEED_EVIDENCE_DIR:-./.placeholder}:/clips:ro
    environment:
      <<: *service-env
      SEED_EVIDENCE_DIR: /clips
      SEED_IDENTITY_URL: http://identity:8089
      SEED_EVIDENCE_URL: http://evidence:8090
      SEED_WORKFLOW_URL: http://workflow:8087
      SEED_TENANT_ID: ${SEED_TENANT_ID:-tnt_dev}
      SEED_EMAIL: ${SEED_EMAIL:-owner@vip.dev}
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    depends_on:
      evidence: { condition: service_healthy }
    restart: 'no'

volumes:
  mongo_data:
  redis_data:
  minio_data:
  nats_data:
  caddy_data:
  caddy_config:
